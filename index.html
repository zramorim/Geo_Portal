<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Ambiental</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- CSS EMBUTIDO DIRETAMENTE (Garante que o visual funcione sempre) -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; margin: 0; padding: 0; }
        .container { display: flex; height: 100vh; background-color: #0f172a; color: #e2e8f0; width: 100%; }
        #map { flex: 3; height: 100%; min-height: 400px; z-index: 1; }
        .sidebar { flex: 1; padding: 25px; background: linear-gradient(145deg, #1e293b, #0f172a); border-left: 3px solid #22c55e; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; z-index: 2; box-shadow: -5px 0 15px rgba(0,0,0,0.5); min-width: 320px; }
        .cabecalho-sidebar { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .cabecalho-sidebar h2 { font-size: 1.4rem; color: #22c55e; text-transform: uppercase; letter-spacing: 1px; margin: 0; }
        #btn-pdf { background-color: #22c55e; color: #0f172a; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: background 0.3s ease; }
        #btn-pdf:hover { background-color: #FFD700; }
        .resumo-container { display: flex; gap: 15px; margin-bottom: 10px; }
        .card { flex: 1; background: rgba(34, 197, 94, 0.1); border: 1px solid rgba(34, 197, 94, 0.3); border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .card p { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
        .card h3 { color: #FFD700; font-size: 1.5rem; border: none; padding: 0; margin: 0; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #22c55e; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="container" id="area-relatorio">
        <div id="map"></div>
        
        <div class="sidebar">
            <div class="cabecalho-sidebar">
                <h2>Dashboard do CAR</h2>
                <button id="btn-pdf" onclick="gerarPDF()">Baixar Relatório (PDF)</button>
            </div>
            
            <div class="resumo-container">
                <div class="card">
                    <p>Propriedades</p>
                    <h3 id="total-prop">0</h3>
                </div>
                <div class="card">
                    <p>Área Total</p>
                    <h3 id="total-area">0 ha</h3>
                </div>
            </div>
            
            <canvas id="meuGrafico"></canvas>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Chamando o JS com nova versão -->
    <script src="app.js?v=9"></script>
</body>
</html>
