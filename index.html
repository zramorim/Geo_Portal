<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Ambiental</title>
    <!-- Bibliotecas de Estilo -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css?v=8">
</head>
<body style="background-color: #0f172a; margin: 0; padding: 0;">

    <div class="container" id="area-relatorio">
        <div id="map"></div>
        
        <div class="sidebar">
            <div class="cabecalho-sidebar">
                <h2>Dashboard do CAR</h2>
                <button id="btn-pdf" onclick="gerarPDF()">Baixar Relatório (PDF)</button>
            </div>
            
            <div class="resumo-container">
                <div class="card">
                    <p>Propriedades</p>
                    <h3 id="total-prop">0</h3>
                </div>
                <div class="card">
                    <p>Área Total</p>
                    <h3 id="total-area">0 ha</h3>
                </div>
            </div>
            
            <canvas id="meuGrafico"></canvas>
        </div>
    </div>

    <!-- Bibliotecas de Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <!-- Nosso Script -->
    <script src="app.js?v=8"></script>
</body>
</html>
